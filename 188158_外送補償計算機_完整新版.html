<title>_188158_外送補償計算機</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f3f4f6;color:#111827}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 40px}
.hero{text-align:center;color:white;background:linear-gradient(145deg,#111827,#1f2937);margin:0 -16px;padding:28px 20px 35px;border-radius:0 0 28px 28px}
.avatar{width:220px;height:220px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 22px;border:5px solid #facc15}
h1{font-size:27px;margin:0;font-weight:900}
.sub{margin:8px 0 0;color:#cbd5e1;font-size:14px}
.threads-btn{display:inline-flex;align-items:center;justify-content:center;margin-top:18px;padding:11px 22px;background:#000;color:#fff;text-decoration:none;border-radius:999px;font-size:15px;font-weight:700;transition:.2s;border:1px solid #444}
.threads-btn:hover{transform:scale(1.05);background:#222}
.card{background:#fff;border-radius:21px;margin-top:22px;padding:22px;box-shadow:0 8px 30px rgba(15,23,42,.08)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-weight:800;font-size:14px;margin-bottom:8px}
.field input{width:100%;height:54px;border:1px solid #d1d5db;border-radius:12px;padding:0 14px;font-size:18px;outline:none}
.field input:focus{border-color:#6d28d9;box-shadow:0 0 0 3px rgba(109,40,217,.12)}
.unit{font-size:12px;color:#64748b;margin-top:6px}
button{width:100%;height:57px;border:0;border-radius:13px;margin-top:18px;background:#6d28d9;color:white;font-size:18px;font-weight:900;cursor:pointer}
button:active{transform:scale(.99)}
.result{display:none;margin-top:20px;padding:22px;border-radius:20px;background:linear-gradient(145deg,#4c1d95,#6d28d9);color:white}
.result-title{font-size:20px;font-weight:900;text-align:center;margin-bottom:18px}
.main-result{text-align:center;background:rgba(255,255,255,.10);border-radius:16px;padding:18px 10px}
.main-label{font-size:13px;color:#ddd6fe}
.amount{font-size:40px;font-weight:950;margin-top:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.08);border-radius:13px;padding:13px}
.stat-label{font-size:12px;color:#ddd6fe}
.stat-value{font-size:18px;font-weight:850;margin-top:5px}
.note{font-size:12px;color:#c4b5fd;line-height:1.6;margin-top:15px;text-align:center}
.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px}
@media(max-width:560px){.inputs{grid-template-columns:1fr}.hero{padding-top:24px}h1{font-size:25px}.amount{font-size:36px}.avatar{width:210px;height:210px}}
</style>
</head>

<div class="main-result"><div class="main-label">法定最低基本報酬</div><div class="amount" id="requiredAmount">NT$0</div></div>
<div class="grid">
<div class="stat"><div class="stat-label">時間計算結果</div><div class="stat-value" id="timeAmount">NT$0</div></div>
<div class="stat"><div class="stat-label">45 元最低保障</div><div class="stat-value" id="minimumAmount">NT$45</div></div>
<div class="stat"><div class="stat-label">你實際拿到</div><div class="stat-value" id="actualAmount">NT$0</div></div>
<div class="stat"><div class="stat-label">應補金額</div><div class="stat-value" id="difference">NT$0</div></div>
</div>
<div class="note">計算方式：服務時間 × 245 元／小時，計算結果無條件進位至小數第 1 位；每筆訂單最低保障 45 元。</div>
</div>
</section>
<div class="footer">_188158_外送補償計算機</div>
</div>
<script>
function formatMoney(value){return "NT$"+Number(value).toFixed(1).replace(".0","");}
function calculate(){
const minutes=parseFloat(document.getElementById("minutes").value);
const actual=parseFloat(document.getElementById("actual").value);
if(isNaN(minutes)||isNaN(actual)||minutes<0||actual<0){alert("請輸入正確的時間與實際基本報酬");return;}
const timeAmount=minutes/60*245;
const roundedTime=Math.ceil(timeAmount*10)/10;
const roundedRequired=Math.max(roundedTime,45);
const diff=Math.max(0,Math.round((roundedRequired-actual)*10)/10);
document.getElementById("requiredAmount").textContent=formatMoney(roundedRequired);
document.getElementById("timeAmount").textContent=formatMoney(roundedTime);
document.getElementById("minimumAmount").textContent="NT$45";
document.getElementById("actualAmount").textContent=formatMoney(actual);
document.getElementById("difference").textContent=formatMoney(diff);
document.getElementById("result").style.display="block";
}
</script>
</body>
</html>
