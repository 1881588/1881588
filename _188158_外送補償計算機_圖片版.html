<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<title>_188158_外送補償計算機</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:linear-gradient(180deg,#111827 0%,#17112b 39%,#f5f5f7 39%,#f5f5f7 100%);color:#171717}
.wrap{max-width:720px;margin:0 auto;padding:22px 14px 32px}
.hero{text-align:center;color:white;padding:5px 0 20px}
.avatar{width:140px;height:140px;margin:0 auto 13px;border-radius:50%;object-fit:cover;border:4px solid #facc15;box-shadow:0 10px 28px rgba(0,0,0,.38)}
h1{font-size:27px;margin:0;font-weight:900;letter-spacing:.4px}
.sub{margin:6px 0 0;color:#cbd5e1;font-size:14px}
.card{background:#fff;border-radius:21px;padding:18px;box-shadow:0 10px 28px rgba(15,23,42,.10);margin-bottom:15px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field label{display:block;font-weight:800;font-size:15px;margin-bottom:8px;color:#374151}
.field input{width:100%;height:54px;border:1px solid #d8dee9;border-radius:14px;padding:0 14px;font-size:18px;outline:none;background:#f8fafc}
.field input:focus{border-color:#6d28d9;box-shadow:0 0 0 3px rgba(109,40,217,.12)}
.unit{font-size:12px;color:#64748b;margin-top:5px}
button{width:100%;height:57px;border:0;border-radius:16px;background:linear-gradient(135deg,#facc15,#f59e0b);color:#111827;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 8px 18px rgba(245,158,11,.23)}
.result{background:linear-gradient(145deg,#4c1d95,#24104d);color:white;border-radius:21px;padding:18px;box-shadow:0 12px 30px rgba(76,29,149,.23)}
.result-title{font-size:20px;font-weight:900;margin-bottom:14px}
.main-result{text-align:center;background:rgba(0,0,0,.18);border-radius:16px;padding:18px 10px;margin-bottom:11px}
.main-label{font-size:13px;color:#ddd6fe}
.amount{font-size:40px;font-weight:950;color:#facc15;margin:3px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:12px}
.stat-label{font-size:12px;color:#ddd6fe}
.stat-value{font-size:18px;font-weight:850;margin-top:4px}
.note{font-size:12px;color:#64748b;line-height:1.7;text-align:center;margin-top:11px}
.footer{text-align:center;color:#94a3b8;font-size:11px;margin-top:17px}
@media(max-width:560px){.inputs{grid-template-columns:1fr}.wrap{padding:17px 12px 26px}h1{font-size:24px}.avatar{width:124px;height:124px}.card,.result{border-radius:18px}}
</style>
</head>

<h1>_188158_外送補償計算機</h1>
<p class="sub">輸入訂單資料，快速算出應得基本報酬</p>
</section>

<section class="card">
<div class="inputs">
<div class="field">
<label>外送服務期間</label>
<input id="minutes" type="number" inputmode="decimal" min="0" step="0.1" placeholder="例如 30">
<div class="unit">分鐘</div>
</div>
<div class="field">
<label>實際基本報酬</label>
<input id="actual" type="number" inputmode="decimal" min="0" step="0.01" placeholder="可留空">
<div class="unit">元</div>
</div>
</div>
<div style="height:14px"></div>
<button onclick="calculate()">算算看</button>
</section>

<section class="result">
<div class="result-title">計算結果</div>
<div class="main-result">
<div class="main-label">應得基本報酬</div>
<div class="amount" id="required">NT$ 0</div>
<div class="main-label">依服務時間計算</div>
</div>
<div class="grid">
<div class="stat"><div class="stat-label">時間計算結果</div><div class="stat-value" id="timeResult">NT$ 0</div></div>
<div class="stat"><div class="stat-label">45 元最低保障</div><div class="stat-value">NT$ 45</div></div>
<div class="stat"><div class="stat-label">你實際拿到</div><div class="stat-value" id="actualResult">未填寫</div></div>
<div class="stat"><div class="stat-label">少了 / 多了</div><div class="stat-value" id="difference">—</div></div>
</div>
</section>

<div class="note">外送服務期間包含接單後前往商家、店家等待、送往消費者地點及等待取件等時間。<br>疊單請分筆計算。</div>
<div class="footer">_188158_ 外送補償計算機</div>
</div>

<script>
function money(n){
  return "NT$ " + n.toLocaleString("zh-TW",{minimumFractionDigits:0,maximumFractionDigits:1});
}
function calculate(){
  const minutes = parseFloat(document.getElementById("minutes").value);
  const actualRaw = document.getElementById("actual").value.trim();

  if (!Number.isFinite(minutes) || minutes < 0){
    alert("請輸入正確的服務分鐘數");
    return;
  }

  const timeAmount = minutes / 60 * 245;
  const roundedTime = Math.ceil(timeAmount * 10) / 10;
  const roundedRequired = Math.max(roundedTime,45);

  document.getElementById("required").textContent = money(roundedRequired);
  document.getElementById("timeResult").textContent = money(roundedTime);

  if (actualRaw === ""){
    document.getElementById("actualResult").textContent = "未填寫";
    document.getElementById("difference").textContent = "—";
    return;
  }

  const actual = parseFloat(actualRaw);
  if (!Number.isFinite(actual) || actual < 0){
    alert("請輸入正確的實際基本報酬");
    return;
  }

  const diff = Math.max(0, Math.round((roundedRequired - actual) * 10) / 10);
}
</script>
